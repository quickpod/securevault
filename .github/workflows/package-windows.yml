name: package-windows
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag holding the signed exe
        required: true
      build_run_id:
        description: Run id of the build-windows run whose staging to reuse
        required: true
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download staging from build run
        uses: actions/download-artifact@v4
        with:
          name: securevault-staging
          path: packaging/staging
          run-id: ${{ github.event.inputs.build_run_id }}
          github-token: ${{ github.token }}
      - name: Replace exes with the signed ones from the release
        shell: pwsh
        # BOTH binaries must be replaced. svhost.exe is the browser-autofill
        # native messaging host; it was never downloaded here, so the installer
        # shipped it straight from the unsigned CI build. On any machine with
        # Smart App Control or a WDAC policy enforcing, cmd.exe is refused when
        # the launcher .bat tries to load it (CodeIntegrity 3077/3033, WinError
        # 4551) and the extension reports only "error while communicating with
        # native messaging host" - no clue that a signature is the cause.
        # Verify both and fail the build rather than ship unsigned again.
        run: |
          foreach ($exe in 'SecureVault.exe', 'svhost.exe') {
            gh release download "${{ github.event.inputs.tag }}" --pattern $exe -D packaging\staging --clobber
            $sig = Get-AuthenticodeSignature "packaging\staging\$exe"
            "$exe -> $($sig.Status)"
            if ($sig.Status -ne 'Valid') {
              throw "$exe is not validly signed ($($sig.Status)) - refusing to package it."
            }
          }
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Compile installer from signed contents
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\installer.iss'
      - name: Upload signed-content installer
        uses: actions/upload-artifact@v4
        with:
          name: securevault-setup-signed
          path: packaging/dist/SecureVault-Setup.exe
          if-no-files-found: error

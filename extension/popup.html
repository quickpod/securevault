<!doctype html>
<html>
<head><meta charset="utf-8">
<style>
  /* SecureVault popup — Aura-flavoured, light + dark via prefers-color-scheme.
     Tokens mirror the app's svtheme palette so the popup reads as the same
     product as the vault window. */
  :root {
    --bg: #f6f7fb; --surface: #ffffff; --text: #1c1e26; --muted: #5c6270;
    --border: #d8dbe4; --accent: #4f6bff; --accent-soft: #e3e8ff;
    --good-bg: #e5f5e9; --good-fg: #135c2d;
    --bad-bg: #fdecec;  --bad-fg: #8f1d1d;
    --warn-bg: #fff3dc; --warn-fg: #7a4d00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161c; --surface: #1d2029; --text: #e8eaf1; --muted: #9aa1b2;
      --border: #333846; --accent: #7c90ff; --accent-soft: #2a3152;
      --good-bg: #16311f; --good-fg: #7fd39a;
      --bad-bg: #3a1a1a;  --bad-fg: #f09a9a;
      --warn-bg: #3a2d10; --warn-fg: #ffce7a;
    }
  }
  * { box-sizing: border-box; }
  body { font: 13px system-ui, "Segoe UI", sans-serif; width: 300px; margin: 0;
         background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; gap: 8px; padding: 10px 12px 8px; }
  header img { width: 20px; height: 20px; }
  header .name { font-size: 14px; font-weight: 600; }
  .beam { height: 2px; margin: 0 0 2px;
          background: linear-gradient(90deg, var(--accent), transparent); }
  main { padding: 8px 12px 12px; }
  #status { padding: 8px 10px; border-radius: 8px; margin: 2px 0 8px;
            border: 1px solid transparent; }
  .ok   { background: var(--good-bg); color: var(--good-fg); }
  .bad  { background: var(--bad-bg);  color: var(--bad-fg); }
  .warn { background: var(--warn-bg); color: var(--warn-fg); }
  p { color: var(--muted); margin: 6px 0 0; line-height: 1.35; }
  .hidden { display: none !important; }
  #pin { font: 20px ui-monospace, Consolas, monospace; width: 140px;
         letter-spacing: 5px; padding: 6px; text-align: center;
         background: var(--surface); color: var(--text);
         border: 1px solid var(--border); border-radius: 8px; outline: none;
         margin-top: 8px; }
  #pin:focus { border-color: var(--accent); }
  button { font: 13px system-ui, "Segoe UI", sans-serif; padding: 6px 12px;
           margin-top: 8px; cursor: pointer; border-radius: 8px;
           border: 1px solid var(--border); background: var(--surface);
           color: var(--text); }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent);
                   color: #fff; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .row button { flex: 1 1 auto; }
  #msg { margin-top: 8px; min-height: 16px; }
  #msg.err  { color: var(--bad-fg); }
  #msg.good { color: var(--good-fg); }
  .link { background: none !important; border: none !important;
          color: var(--accent); text-decoration: underline; padding: 0;
          margin-top: 10px; font-size: 12px; }
  #site { margin-top: 2px; padding: 8px 10px; border-radius: 8px;
          background: var(--surface); border: 1px solid var(--border); }
  #site .domain { font-weight: 600; }
  #site .count { color: var(--muted); font-size: 12px; margin-top: 2px; }
  #bmline { color: var(--muted); font-size: 12px; }
  #gen { font: 12px ui-monospace, Consolas, monospace; margin-top: 8px;
         padding: 6px 8px; border-radius: 8px; background: var(--surface);
         border: 1px solid var(--border); word-break: break-all;
         user-select: all; }
</style></head>
<body>
  <header>
    <img src="icons/32.png" alt="">
    <span class="name">SecureVault</span>
  </header>
  <div class="beam"></div>
  <main>
    <div id="status">checking…</div>

    <!-- the app is not running at all -->
    <div id="launchbox" class="hidden">
      <button id="launchbtn" class="primary">Open SecureVault</button>
    </div>

    <!-- shown only when this browser has never been paired, or was revoked -->
    <div id="pairbox" class="hidden">
      <p>In the SecureVault app, open <b>Passwords → Browsers… → Pair a
         browser</b>, then type the 6-digit PIN it shows:</p>
      <input id="pin" maxlength="6" inputmode="numeric" autocomplete="off"
             placeholder="······" aria-label="6-digit pairing PIN">
      <div><button id="pairbtn" class="primary">Pair</button></div>
      <div id="msg"></div>
    </div>

    <!-- shown once paired AND the vault is open -->
    <div id="pairedbox" class="hidden">
      <div id="site" class="hidden">
        <div class="domain"></div>
        <div class="count"></div>
      </div>
      <div class="row">
        <button id="fillbtn">Fill on this page</button>
        <button id="genbtn">Generate password</button>
      </div>
      <div class="row">
        <button id="openvaultbtn">Open vault</button>
      </div>
      <div id="gen" class="hidden"></div>
      <div id="bmbox" class="hidden">
        <div id="bmline" style="margin-top:8px"></div>
        <div class="row">
          <button id="bmbackup">Back up bookmarks</button>
          <button id="bmrestore">Restore…</button>
        </div>
        <div id="bmconfirm" class="hidden">
          <p id="bmconfirmtext"></p>
          <div class="row">
            <button id="bmmerge" class="primary">Merge</button>
            <button id="bmreplace">Replace all</button>
            <button id="bmcancel">Cancel</button>
          </div>
        </div>
      </div>
      <div id="msg2"></div>
      <button id="unpairbtn" class="link">Forget this pairing</button>
    </div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
